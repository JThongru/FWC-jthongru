<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            height: 150px;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td style="background-color: red; color: white;">You take the red pill - you stay in Wonderland and I show you how deep the rabbit hole goes</td>
            <td style="background-color: blue; color: white;">You take the blue pill - the story ends, you wake up in your bed and believe whatever you want to believe.</td>
        </tr>
    </table>
</body>
</html>
