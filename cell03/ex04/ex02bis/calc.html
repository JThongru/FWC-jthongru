<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>It's over 9000</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <div class="calculator">
        <input type="text" id="left">
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
        <input type="text" id="right">
        <!-- ตัด onclick="calculate()" ออก -->
        <input type="submit" value="Try me!">
    </div>

    <!-- โหลด jQuery CDN ก่อนเริ่มอ่าน calc.js -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="calc.js"></script>
</body>
</html>
